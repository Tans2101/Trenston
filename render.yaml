# Render Blueprint — Trenston API
# Production database is MongoDB Atlas (MONGO_URL). Do not provision a second Mongo.
# If a leftover helm-mongo private service still exists on Render, delete it after
# confirming /api/health shows Atlas.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: helm-company-cockpit
    runtime: python
    plan: starter
    repo: https://github.com/Tans2101/Helm---Company-Cockpit
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-prod.txt && python scripts/check_prod_env.py && python -c "import storage, pagination, document_cleanup, rate_limit, weekly_pack_export, department_report_drafts, financial_export, credential_crypto"
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: USE_ATLAS_MONGO
        value: "true"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: trenston
      - key: SESSION_SECRET
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://www.trenston.com
      - key: APP_URL
        value: https://www.trenston.com
      - key: CORS_ORIGINS
        value: https://www.trenston.com,https://trenston.com,https://www.helmcontrol.online,https://helmcontrol.online
      - key: COOKIE_DOMAIN
        value: trenston.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "lax"
      - key: ALLOW_DEMO_LOGIN
        value: "false"
      - key: DEMO_RESET_ENABLED
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: CLERK_SECRET_KEY
        sync: false
        # Must be sk_live_ from the clerk.trenston.com Clerk instance (same as CLERK_PUBLISHABLE_KEY).
      - key: CLERK_PUBLISHABLE_KEY
        value: pk_live_Y2xlcmsudHJlbnN0b24uY29tJA
      - key: CLERK_JWKS_URL
        value: https://clerk.trenston.com/.well-known/jwks.json
      - key: CLERK_PRIMARY_ORIGIN
        value: https://www.trenston.com
      - key: SETUP_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: QUICKBOOKS_CLIENT_ID
        sync: false
      - key: QUICKBOOKS_CLIENT_SECRET
        sync: false
      - key: QUICKBOOKS_ENV
        value: production
      - key: XERO_CLIENT_ID
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
        # Fernet key for OAuth / ERP credentials at rest. Generate with:
        # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
        # Never commit the real value. After setting, run:
        # python scripts/migrate_encrypt_integration_tokens.py
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_PRICE_ID_STARTER
        sync: false
      - key: PADDLE_PRICE_ID_GROWTH
        sync: false
      - key: PADDLE_PRICE_ID_BUSINESS
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_ENV
        value: production
      - key: BILLING_ENFORCED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
        # After Resend verifies send.trenston.com, set:
        # Trenston <contact@trenston.com>
        # Until then, Resend will reject sends from this domain.
      - key: INTERNAL_CRON_SECRET
        sync: false
      - key: ANALYTICS_ADMIN_EMAIL
        value: tansherdhawan@gmail.com

  - type: cron
    name: helm-retention-checks
    runtime: python
    plan: starter
    repo: https://github.com/Tans2101/Helm---Company-Cockpit
    branch: main
    rootDir: backend
    schedule: "0 13 * * *"
    buildCommand: pip install --upgrade pip
    startCommand: python scripts/run_retention_cron.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: INTERNAL_CRON_SECRET
        sync: false
      - key: RETENTION_CRON_URL
        value: https://www.trenston.com/api/internal/run-retention-checks

  - type: cron
    name: helm-accounting-sync
    runtime: python
    plan: starter
    repo: https://github.com/Tans2101/Helm---Company-Cockpit
    branch: main
    rootDir: backend
    schedule: "15 * * * *"
    buildCommand: pip install --upgrade pip
    startCommand: python scripts/run_accounting_sync_cron.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: INTERNAL_CRON_SECRET
        sync: false
      - key: ACCOUNTING_SYNC_CRON_URL
        value: https://www.trenston.com/api/internal/run-accounting-sync

  # Daily insights refresh + high-severity email/Slack.
  # Fixed 12:00 UTC for a first pass (not yet per-workspace timezone).
  - type: cron
    name: helm-daily-alerts
    runtime: python
    plan: starter
    repo: https://github.com/Tans2101/Helm---Company-Cockpit
    branch: main
    rootDir: backend
    schedule: "0 12 * * *"
    buildCommand: pip install --upgrade pip
    startCommand: python scripts/run_daily_alerts_cron.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: INTERNAL_CRON_SECRET
        sync: false
      - key: DAILY_ALERTS_CRON_URL
        value: https://www.trenston.com/api/internal/run-daily-alerts

  # Weekly pack PDF emailed to CEO/owner (separate from daily alerts).
  - type: cron
    name: helm-weekly-digest
    runtime: python
    plan: starter
    repo: https://github.com/Tans2101/Helm---Company-Cockpit
    branch: main
    rootDir: backend
    schedule: "0 14 * * 1"
    buildCommand: pip install --upgrade pip
    startCommand: python scripts/run_weekly_digest_cron.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: INTERNAL_CRON_SECRET
        sync: false
      - key: WEEKLY_DIGEST_CRON_URL
        value: https://www.trenston.com/api/internal/run-weekly-digest

  # Daily morning ops briefing email (Sales / Procurement / Production / Maintenance).
  # Separate from weekly pack PDF and from noon insights alerts.
  # Fixed 03:00 UTC (~08:30 IST) — no per-workspace timezone field yet.
  - type: cron
    name: helm-daily-briefing
    runtime: python
    plan: starter
    repo: https://github.com/Tans2101/Helm---Company-Cockpit
    branch: main
    rootDir: backend
    schedule: "0 3 * * *"
    buildCommand: pip install --upgrade pip
    startCommand: python scripts/run_daily_briefing_cron.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: INTERNAL_CRON_SECRET
        sync: false
      - key: DAILY_BRIEFING_CRON_URL
        value: https://www.trenston.com/api/internal/run-daily-briefing

  # Purge uncommitted bill/receipt uploads older than DOC_ORPHAN_RETENTION_DAYS (default 7).
  # Admin route uses SETUP_SECRET (X-Setup-Secret), not INTERNAL_CRON_SECRET.
  - type: cron
    name: helm-orphan-doc-cleanup
    runtime: python
    plan: starter
    repo: https://github.com/Tans2101/Helm---Company-Cockpit
    branch: main
    rootDir: backend
    schedule: "30 4 * * *"
    buildCommand: pip install --upgrade pip
    startCommand: python scripts/run_orphan_cleanup_cron.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SETUP_SECRET
        sync: false
      - key: ORPHAN_CLEANUP_CRON_URL
        value: https://www.trenston.com/api/admin/cleanup-orphaned-documents
