# Trigger Render deploy on every push to main (uses deploy hook secret).
# Add RENDER_DEPLOY_HOOK_URL in GitHub → Settings → Secrets → Actions.
# Get the hook URL from Render → helm-company-cockpit → Settings → Deploy Hook.
name: Deploy Render API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Repo was renamed Trenston; keep the old name so either remote still deploys.
    if: github.repository == 'Tans2101/Trenston' || github.repository == 'Tans2101/Helm---Company-Cockpit'
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -n "${HOOK:-}" ]; then
            echo "Deploying via Render deploy hook..."
            curl -fsS -X POST "$HOOK"
            echo "Deploy hook triggered."
          elif [ -n "${API_KEY:-}" ] && [ -n "${SERVICE_ID:-}" ]; then
            echo "Deploying via Render API..."
            curl -fsS -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}'
            echo "API deploy triggered."
          else
            echo "::warning::No RENDER_DEPLOY_HOOK_URL or RENDER_API_KEY+RENDER_SERVICE_ID secrets set."
            echo "Render will only deploy if its GitHub auto-deploy is connected."
            exit 0
          fi
