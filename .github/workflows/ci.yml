# Unit tests on pull requests and pushes to main.
# Skips live Emergent/preview API suites (they need REACT_APP_BACKEND_URL).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio
      - name: Run unit tests
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: helm_ci_test
          # Leave REACT_APP_BACKEND_URL unset so live-API suites skip/collect cleanly.
        run: |
          python -m pytest -q \
            --ignore=tests/test_kalun_backend.py \
            --ignore=tests/test_kalun_multitenant.py \
            --ignore=tests/test_updates_myday_join_exec.py \
            --ignore=tests/test_packs_activity_people.py \
            --ignore=tests/test_financials_onboarding.py \
            --ignore=tests/test_paddle_billing.py \
            --tb=line

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run tests
        run: CI=true yarn test --watchAll=false
