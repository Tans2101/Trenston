<!doctype html>
<html lang="en">
    <head>
    <!-- DNS only on every page; Login/SignUp open a full preconnect when needed. -->
    <link rel="dns-prefetch" href="https://clerk.trenston.com" />
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#FFFFFF" />
        <script>
          try {
            var helmTheme = localStorage.getItem("helm_appearance") || "light";
            var resolvedHelmTheme = helmTheme === "system"
              ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
              : helmTheme;
            document.documentElement.dataset.theme = resolvedHelmTheme;
            document.documentElement.style.colorScheme = resolvedHelmTheme;
          } catch (e) {}
        </script>
        <script>document.documentElement.setAttribute("data-js", "1");</script>
        <style>
          /* Each public page ships a plain-text copy inside #root for crawlers and readers
             without JavaScript. When JavaScript runs, React replaces it, so keep it from
             flashing as unstyled text first. */
          html[data-js] #root > [id^="helm-prerender"] { display: none; }
        </style>
        <meta name="description" content="Briefing, decisions, financials, and department work in one place. Built for founders and CEOs running real operations, however lean the team." />
        <meta name="google-site-verification" content="%REACT_APP_GOOGLE_SITE_VERIFICATION%" />
